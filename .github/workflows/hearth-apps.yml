# Builds the Hearth apps: Windows, macOS and Linux (hearth/desktop), Android and iPhone (hearth/mobile).
#   Runs on every push that changes the apps, on tags like `app-v1.17.0` (attached to a GitHub release),
#   and from the Actions tab ("Run workflow").
#   Result: download them from the run's "Artifacts" section, or the release for tags.
#   Optional repository variable HEARTH_SERVER (e.g. https://chat.example.com): bakes your server's address in
#   so people don't have to type it. The Android app then also opens https://that-server/invite/... links itself
#   (Android App Links: set ANDROID_CERT_SHA256 on the server, see hearth/.env.example).
#   Optional secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD:
#   sign Android builds with your own key (see hearth/mobile/README.md); with them, a Google Play bundle (.aab) is
#   built too. Without them the APK is built UNSIGNED (Hearth-<version>-UNSIGNED.apk, artifact
#   hearth-android-UNSIGNED): Android won't install it, and it's never attached to a release or copied to your
#   server. No signing key is ever made or kept here.
#   Optional secrets VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_DOWNLOADS_DIR: copy the installers to your server's
#   data/downloads folder, where they show up on https://your-server/download. Use a user that can only write
#   that folder (not root). With them, VPS_HOST_FINGERPRINT is required too: the server's SSH host key
#   fingerprint (on the server: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub, the SHA256:... part), so the
#   copy refuses any other machine.
#   Optional secret UPDATE_SIGNING_KEY and variable UPDATE_PUBLIC_KEY (an Ed25519 key pair; make one with
#   `node hearth/desktop/build/sign-update.js keygen`): the public key is built into the apps, which then only
#   install updates signed with the private one; the private key signs the desktop update files (latest*.yml.sig)
#   in the sign-updates job, which runs no code from npm packages, and only when UPDATE_PUBLIC_KEY is set to its
#   public half (already have the secret? don't make a new pair: the sign-updates job prints the public half to
#   use, as does `sign-update.js pubkey`). Without the key pair the apps still update, but ask first and say the
#   update can't be verified.
#
#   Security: every job only gets read access to the repository, except "release" (it creates the GitHub
#   release). Actions are pinned to exact commits (the comment says which version; Dependabot updates them),
#   checkouts don't keep the token, and the Android build installs exactly what's in its package-lock.json.
#   The server copy uses the runner's own ssh/scp, so no third-party code ever handles VPS_SSH_KEY.
#   The jobs that sign update files or publish releases (sign-updates, play-upload, ios-archive, testflight-upload,
#   release, publish-to-vps) run in the GitHub environment "production", and only for app-v* tags and the default
#   branch: put UPDATE_SIGNING_KEY, PLAY_SERVICE_ACCOUNT_JSON, the ASC_* and IOS_* secrets and the VPS_* secrets
#   there (Settings > Environments), delete the repository secrets of the same names, and add its protection rules
#   (only the default branch and app-v* tags; required reviewers if you want to approve each one). The release and
#   the server copy take only the final artifacts and refuse an unsigned APK, the Play bundle, the iPhone .ipa and
#   SignPath's unsigned inputs. Still repository-wide: the Windows and Android signing secrets, which the build jobs
#   use on every branch.
#
#   Code signing (all optional; builds stay unsigned without them; step-by-step guide: hearth/docs/SIGNING.md):
#     Windows, Azure Artifact Signing: secrets AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET and
#       variables AZURE_SIGNING_ENDPOINT / AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE / AZURE_SIGNING_PUBLISHER.
#     Windows, a .pfx certificate: secrets WIN_CSC_LINK (the .pfx, base64) / WIN_CSC_KEY_PASSWORD.
#     Windows, SignPath (free for open-source projects): secret SIGNPATH_API_TOKEN and variables
#       SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG (optional: SIGNPATH_POLICY_SLUG, default release-signing;
#       SIGNPATH_ARTIFACT_CONFIG_SLUG, default initial). Release builds only: app-v* tags, the default branch and
#       manual runs; approve each request on signpath.io. A manual run with "SignPath test signing" ticked signs with
#       the test-signing policy instead (variable SIGNPATH_TEST_POLICY_SLUG, default test-signing), for SignPath's
#       review before it issues the real certificate; nothing from that run is released or published.
#     Windows: variable WINDOWS_REQUIRE_SIGNING=true fails the build instead of making an unsigned installer.
#     Google Play: secret PLAY_SERVICE_ACCOUNT_JSON uploads the bundle to the internal testing track
#       (needs the ANDROID_KEYSTORE_* secrets; variable PLAY_RELEASE_STATUS=draft while the app is still a draft).
#     iPhone (App Store, through TestFlight; hearth/docs/IOS-STORE.md): variable APPLE_TEAM_ID and, in the
#       production environment, secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 (an App Store Connect API key:
#       Admin role for Xcode's cloud-managed signing, option A). Option B, your own certificate: also
#       IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD and IOS_PROFILE_APP_BASE64 / IOS_PROFILE_NSE_BASE64 /
#       IOS_PROFILE_SHARE_BASE64 there (then App Manager is enough). Variable IOS_REQUIRE_SIGNING=true fails the run
#       instead of skipping the signed app. The iPhone app is built for one server (HEARTH_SERVER, locked): its push
#       goes through Apple with the publisher's own key, which only that server has. Every push builds and opens it
#       in the simulator, unsigned and with no secrets; tags and the default branch also sign it (ios-archive) and
#       send it to TestFlight (testflight-upload); without a HEARTH_SERVER of the form https://host there's no signed
#       iPhone app, and a manual run's "server" never changes it. The .ipa is never attached to a release or copied
#       to your server.
name: Hearth apps

on:
  push:
    branches: ['**']
    tags: ['app-v*']
    paths:
      - 'hearth/desktop/**'
      - 'hearth/mobile/**'
      - '.github/workflows/hearth-apps.yml'
  workflow_dispatch:
    inputs:
      server:
        description: 'Server address baked into these builds (empty: the HEARTH_SERVER variable, else the one in the app config files)'
        required: false
        default: ''
      signpath_test:
        description: 'SignPath test signing: sign the Windows app with your test certificate (SignPath checks this before it issues the real one). Nothing from this run is released, copied to your server or sent to Google Play.'
        type: boolean
        required: false
        default: false

# Least privilege: read-only unless a job says otherwise.
permissions:
  contents: read

concurrency:
  group: hearth-apps-${{ github.ref }}${{ github.event.inputs.signpath_test == 'true' && '-signpath-test' || '' }}
  cancel-in-progress: true

env:
  SERVER: ${{ github.event.inputs.server || vars.HEARTH_SERVER }}
  # A SignPath test-signing run (a manual run with "SignPath test signing" ticked): signed with the test certificate,
  # which no computer trusts, so none of it may reach anyone. The jobs that sign update files, release or publish
  # don't run for it.
  SIGNPATH_TEST: ${{ github.event.inputs.signpath_test == 'true' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath fetches the unsigned build (an artifact of this run) with this job's token
    defaults:
      run:
        working-directory: hearth/desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set the version (from the tag, or Hearth's own version)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then v="${GITHUB_REF_NAME#app-v}"; else v="$(node -p "require('../package.json').version")"; fi
          npm version --no-git-tag-version --allow-same-version "$v"
      - name: Bake in the server address
        if: env.SERVER != ''
        run: node -e "const f='hearth.config.json';const c=require('./'+f);c.defaultServer=process.env.SERVER;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      # Signed updates: the installed app gets the public key and refuses updates not signed with the private one.
      # Only the public half comes here: the private key never reaches a job that runs npm packages' code (the
      # sign-updates job below signs with it).
      - name: Bake in the update signing key
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if [ -n "$UPDATE_PUBLIC_KEY" ]; then
            node build/sign-update.js bake
          else
            echo "::warning title=Update signing::No UPDATE_PUBLIC_KEY variable: these apps can't verify their updates and will ask before installing each one. Have an UPDATE_SIGNING_KEY secret already? Set UPDATE_PUBLIC_KEY to its public half (the sign-updates job prints it; don't make a new pair). See hearth/docs/SIGNING.md."
          fi
      - run: npm ci --no-audit --no-fund
      # Windows: sign with Azure Artifact Signing or a .pfx certificate when those secrets exist; otherwise an
      # unsigned installer and a warning (see hearth/docs/SIGNING.md).
      - name: Choose how to sign the Windows installer
        id: signing
        if: runner.os == 'Windows'
        run: node build/configure-signing.js
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          WIN_TIMESTAMP_SERVER: ${{ vars.WIN_TIMESTAMP_SERVER }}
          WINDOWS_REQUIRE_SIGNING: ${{ vars.WINDOWS_REQUIRE_SIGNING }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_PUBLISHER: ${{ vars.SIGNPATH_PUBLISHER }}
          SIGN_THIS_BUILD: ${{ startsWith(github.ref, 'refs/tags/app-v') || github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch' }}
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Only the Windows build sees the signing secrets, and only the ones for the method chosen above.
          AZURE_TENANT_ID: ${{ steps.signing.outputs.method == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.method == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.method == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
          WIN_CSC_LINK: ${{ steps.signing.outputs.method == 'pfx' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ steps.signing.outputs.method == 'pfx' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      # SignPath: sign Hearth.exe, wrap the installer around the signed app, then sign the installer too.
      # Each request waits (up to an hour) for you to approve it on signpath.io.
      - name: Hand the app to SignPath
        id: unsigned-app
        if: steps.signing.outputs.method == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-windows-unsigned-app
          path: hearth/desktop/dist/win-unpacked/Hearth.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the app (SignPath)
        if: steps.signing.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signing.outputs.test == '1' && (vars.SIGNPATH_TEST_POLICY_SLUG || 'test-signing') || (vars.SIGNPATH_POLICY_SLUG || 'release-signing') }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: hearth/desktop/signed/app
      - name: Build the installer around the signed app
        if: steps.signing.outputs.method == 'signpath'
        run: |
          cp signed/app/Hearth.exe dist/win-unpacked/Hearth.exe
          rm -f dist/*.exe dist/*.blockmap dist/latest.yml
          npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Hand the installer to SignPath
        id: unsigned-setup
        if: steps.signing.outputs.method == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-windows-unsigned-setup
          path: hearth/desktop/dist/Hearth-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer (SignPath)
        if: steps.signing.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signing.outputs.test == '1' && (vars.SIGNPATH_TEST_POLICY_SLUG || 'test-signing') || (vars.SIGNPATH_POLICY_SLUG || 'release-signing') }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: hearth/desktop/signed/setup
      # Signing changed the installer's bytes: update latest.yml and the .blockmap so auto-updates accept it.
      - name: Put the signed installer in place
        if: steps.signing.outputs.method == 'signpath'
        run: |
          cp signed/setup/Hearth-Setup-*.exe dist/
          node build/after-signing.js dist
      # A test run's files are signed with SignPath's self-signed test certificate, which Windows doesn't trust
      # (UnknownError / NotTrusted): that's expected, but every file must still carry a signature.
      - name: Check the signature
        if: runner.os == 'Windows' && steps.signing.outputs.method != 'none'
        shell: pwsh
        env:
          TEST_SIGNING: ${{ steps.signing.outputs.test }}
        run: |
          $test = $env:TEST_SIGNING -eq '1'
          $bad = $false
          foreach ($f in Get-ChildItem dist/*.exe, dist/win-unpacked/Hearth.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) - $($s.SignerCertificate.Subject)"
            $ok = $s.Status -eq 'Valid' -or ($test -and $s.SignerCertificate -and $s.Status -in @('UnknownError', 'NotTrusted'))
            if (-not $ok) { $bad = $true }
          }
          if ($bad) { Write-Host "::error::An .exe is not validly signed."; exit 1 }
          if ($test) { Write-Host "::notice title=SignPath test signing::Signed with the test certificate, which Windows doesn't trust (expected). Send this run's link and its signing requests to SignPath for review. Don't hand these files out." }
      # The update files are signed in the sign-updates job, after anything here that rewrites latest.yml
      # (SignPath's after-signing.js).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-desktop-${{ runner.os }}${{ steps.signing.outputs.test == '1' && '-SIGNPATH-TEST' || '' }}
          path: |
            hearth/desktop/dist/*.exe
            hearth/desktop/dist/*.dmg
            hearth/desktop/dist/*.AppImage
            hearth/desktop/dist/*.deb
            hearth/desktop/dist/*.blockmap
            hearth/desktop/dist/latest*.yml
          if-no-files-found: error

  # Signs the desktop update files (latest*.yml.sig) for builds that reach people's apps: tags and the default
  # branch. A job of its own, so UPDATE_SIGNING_KEY never shares a runner with code from npm packages: it only runs
  # the repository's build/sign-update.js (Node's own modules) on the files the desktop job made. macOS doesn't
  # update itself, so there's nothing to sign for it.
  sign-updates:
    needs: desktop
    if: >-
      github.event.inputs.signpath_test != 'true' &&
      (startsWith(github.ref, 'refs/tags/app-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: hearth/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hearth-desktop-Windows
          path: hearth/desktop/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hearth-desktop-Linux
          path: hearth/desktop/dist
      # sign-update.js refuses (and prints the public half to put in UPDATE_PUBLIC_KEY) when the variable isn't set:
      # the apps were then built without a key, and signing them would let installed apps take an update that
      # never checks another one.
      - name: Sign the update files
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            node build/sign-update.js sign dist
          elif [ -n "$UPDATE_PUBLIC_KEY" ]; then
            echo "::error title=Update signing::These apps were built with UPDATE_PUBLIC_KEY, but there's no UPDATE_SIGNING_KEY secret here to sign their updates with, so they would refuse them. Add it to the production environment."
            exit 1
          else
            echo "::warning title=Update signing::No UPDATE_SIGNING_KEY secret: the update files aren't signed."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-desktop-update-signatures
          path: hearth/desktop/dist/latest*.yml.sig
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearth/mobile
    outputs:
      signed: ${{ steps.secretkey.outputs.found }}
      version: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Capacitor 8 (Android 16 / API 36, which Google Play requires) builds with Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then v="${GITHUB_REF_NAME#app-v}"; else v="$(node -p "require('../package.json').version")"; fi
          # It goes into build.gradle and file names below: only plain version characters.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version number: $v"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          # Android (and Google Play) only accept an update whose versionCode is higher than the installed one:
          # (major*100 + minor) * 100000 + this workflow's run number. 1.21.x → 121xxxxx, always going up.
          IFS=. read -r major minor _ <<< "${v%%-*}"
          code=$(( (10#${major:-0} * 100 + 10#${minor:-0}) * 100000 + GITHUB_RUN_NUMBER % 100000 ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Hearth $v, Android versionCode $code"
      - name: Bake in the server address
        if: env.SERVER != ''
        run: node -e "const f='www/config.json';const c=require('./'+f);c.defaultServer=process.env.SERVER;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      # Exactly the versions in package-lock.json (Dependabot keeps them current).
      - run: npm ci --no-audit --no-fund
      - name: Create the Android project
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          npx cap add android
          cp native/*.java android/app/src/main/java/app/hearth/mobile/
          # Push while the app is closed (UnifiedPush, an exact version), calls that keep going with the screen
          # locked, invite links, the status bar icon and the app's unit tests. Fails if the template changed.
          node scripts/patch-android.js android
          # Microphone and camera for calls and voice messages, notifications for new messages.
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          cat >> android/app/build.gradle <<EOF

          // ---- added by the Hearth build
          dependencies { implementation "androidx.webkit:webkit:\$androidxWebkitVersion" }
          android {
              defaultConfig {
                  versionCode $VERSION_CODE
                  versionName "$VERSION_NAME"
              }
              // Keep the build's list of libraries (encrypted so only Google can read it) out of the APK's signing
              // block: IzzyOnDroid's scanner flags it and F-Droid's signature copying fails on it. The Play bundle
              // keeps it, for Play Console's library checks.
              dependenciesInfo {
                  includeInApk = false
                  includeInBundle = true
              }
          }
          // Signed only with your own key (the ANDROID_KEYSTORE_* secrets); without one the release APK stays unsigned.
          if (System.getenv("HEARTH_KEYSTORE")) {
              android {
                  signingConfigs {
                      hearth {
                          storeFile file(System.getenv("HEARTH_KEYSTORE"))
                          storePassword System.getenv("HEARTH_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("HEARTH_KEY_ALIAS")
                          keyPassword System.getenv("HEARTH_KEY_PASSWORD")
                      }
                  }
                  buildTypes { release { signingConfig signingConfigs.hearth } }
              }
          }
          EOF
      - name: App icon
        continue-on-error: true
        run: npx --no -- capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#100e16' --iconBackgroundColorDark '#100e16' --splashBackgroundColor '#100e16' --splashBackgroundColorDark '#100e16'
      - run: npx cap sync android
      # The server's page runs inside the app: no Capacitor plugin from npm is compiled in (capacitor.config.json's
      # android.includePlugins is empty; the keyboard plugin is only for the iPhone).
      - name: Check the plugins
        run: |
          node -e "
            const p = require('./android/app/src/main/assets/capacitor.plugins.json');
            if (p.length) { console.log('::error::Plugins the remote page could reach: ' + p.map((x) => x.classpath).join(', ')); process.exit(1); }
          "

      # Signing only with your own key, from the ANDROID_KEYSTORE_* secrets. Without them the APK is built unsigned,
      # named and uploaded as UNSIGNED, and never released or copied to your server (Android won't install it
      # anyway). No key is ever made or kept here: anything in the Actions cache can be read by other runs.
      - name: Signing key from secrets
        id: secretkey
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            if [ -z "$KS_PASSWORD" ]; then echo "::error title=Android signing::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD isn't."; exit 1; fi
            umask 077
            echo "$KS" | base64 -d > "$RUNNER_TEMP/hearth.jks"
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Android signing::No ANDROID_KEYSTORE_BASE64 secret: this APK is UNSIGNED (Android won't install it), it is never released or copied to your server, and no Google Play bundle is made. See hearth/docs/SIGNING.md."
          fi
      # The APK is for installing directly (your server's /download page). The .aab bundle is what Google Play
      # takes; it's only built with your own permanent key, since Play remembers the key of the first upload.
      - name: Build the APK (and the Play bundle)
        working-directory: hearth/mobile/android
        env:
          HEARTH_KEYSTORE: ${{ steps.secretkey.outputs.found == '1' && format('{0}/hearth.jks', runner.temp) || '' }}
          HEARTH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEARTH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'hearth' }}
          HEARTH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUNDLE: ${{ steps.secretkey.outputs.found == '1' && 'bundleRelease' || '' }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest ${BUNDLE:+"$BUNDLE"}
          mkdir -p ../dist ../play ../unsigned
          if [ -n "$HEARTH_KEYSTORE" ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/Hearth-$VERSION_NAME.apk"
          else
            # Not signed: kept apart from the real thing, and named so nobody mistakes it for a release.
            cp app/build/outputs/apk/release/app-release-unsigned.apk "../unsigned/Hearth-$VERSION_NAME-UNSIGNED.apk"
          fi
          if [ -n "$BUNDLE" ]; then cp app/build/outputs/bundle/release/app-release.aab "../play/Hearth-$VERSION_NAME-$VERSION_CODE.aab"; fi
      # What actually went into the APK: the push library's receiver, Hearth's unexported push service, the call
      # service with its type and permissions, and the invite link filter.
      - name: Check the merged manifest
        run: |
          m=$(grep -rl HearthPushService android/app/build/intermediates --include AndroidManifest.xml | grep -i release | grep -iv unittest | sort | head -1)
          node scripts/patch-android.js --check-merged "$m"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secretkey.outputs.found == '1'
        with:
          name: hearth-android
          path: hearth/mobile/dist/*.apk
          if-no-files-found: error
      # Unsigned (no signing secrets): only shows the build works. Not installable; never released or published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secretkey.outputs.found != '1'
        with:
          name: hearth-android-UNSIGNED
          path: hearth/mobile/unsigned/*-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secretkey.outputs.found == '1'
        with:
          name: hearth-android-play-bundle
          path: hearth/mobile/play/*.aab
          if-no-files-found: error

  # Google Play internal testing: friends you add as testers install and update Hearth from the Play Store,
  # without the "unknown apps" and Play Protect warnings. Tags and the default branch only (pushed or run by hand),
  # as the production environment's rules allow, with a bundle signed with your own key. A job of its own, in the
  # production environment, so the Play account's key never shares a runner with the build's npm and Gradle code.
  play-upload:
    needs: android
    if: >-
      github.event.inputs.signpath_test != 'true' && needs.android.outputs.signed == '1' &&
      (startsWith(github.ref, 'refs/tags/app-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_PLAY == 'true'
        with:
          name: hearth-android-play-bundle
          path: play
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.hearth.mobile
          releaseFiles: play/*.aab
          releaseName: ${{ needs.android.outputs.version }} (${{ needs.android.outputs.code }})
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  # iPhone: HearthKit's tests (swift test), then the app built for the simulator, unsigned, and opened there once.
  # Every push, no secrets. The Xcode project is generated by Capacitor and patched (scripts/patch-ios.rb), as for
  # Android: there's nothing to keep in sync by hand, and no Mac is needed anywhere.
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: hearth/mobile
    outputs:
      version: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      project: ${{ steps.server.outputs.store }}
    env:
      # Only xcodeproj (for the patch script), exactly as in Gemfile.lock; fastlane is for the upload job.
      BUNDLE_DEPLOYMENT: 'true'
      BUNDLE_WITHOUT: upload
    steps:
      # Tags and the default branch also hand this project to ios-archive, which signs it for the App Store: then it's
      # always for HEARTH_SERVER, locked (a manual run's "server" doesn't change it; push only works there). Without
      # HEARTH_SERVER (or with one that isn't https://host) there's no App Store build.
      - name: Which server
        id: server
        working-directory: .
        env:
          RELEASE_REF: ${{ github.event.inputs.signpath_test != 'true' && (startsWith(github.ref, 'refs/tags/app-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
          HEARTH_SERVER: ${{ vars.HEARTH_SERVER }}
        run: |
          if [ "$RELEASE_REF" != "true" ]; then exit 0; fi
          if [[ "$HEARTH_SERVER" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "SERVER=$HEARTH_SERVER" >> "$GITHUB_ENV"
            echo "store=1" >> "$GITHUB_OUTPUT"
          else
            echo "SERVER=" >> "$GITHUB_ENV"
            echo "::warning title=iPhone::No App Store build: the HEARTH_SERVER variable must be your server's https://host address (the iPhone app is locked to it)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          working-directory: hearth/mobile
      # App Store Connect only takes builds made with the iOS 26 SDK and a released Xcode: the newest Xcode 26 on the
      # runner that isn't a beta. A new major Xcode each autumn means updating this line (and runs-on) on purpose.
      - name: Xcode 26
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc' | sort -V | tail -1)"
          if [ -z "$x" ]; then echo "::error::No Xcode 26 on this runner."; exit 1; fi
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then v="${GITHUB_REF_NAME#app-v}"; else v="$(node -p "require('../package.json').version")"; fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version number: $v"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          # The build number (CFBundleVersion) must go up with every upload: the same formula as Android's
          # versionCode, (major*100 + minor) * 100000 + this workflow's run number. The version people see
          # (CFBundleShortVersionString) is only major.minor.patch; scripts/patch-ios.rb drops the rest.
          IFS=. read -r major minor _ <<< "${v%%-*}"
          code=$(( (10#${major:-0} * 100 + 10#${minor:-0}) * 100000 + GITHUB_RUN_NUMBER % 100000 ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Hearth $v, iPhone build $code"
      # Pure logic shared by the app and its extensions (link rules, push decryption, the keys), on macOS for CryptoKit.
      - name: HearthKit tests
        working-directory: hearth/mobile/ios-native/HearthKit
        run: swift test
      # The App Store build talks to one server only (push uses the publisher's own APNs key): the connect screen
      # can't change it.
      - name: Bake in the server address
        if: env.SERVER != ''
        run: node -e "const f='www/config.json';const c=require('./'+f);c.defaultServer=process.env.SERVER;c.lockServer=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npm ci --no-audit --no-fund
      - run: bundle install
      - name: Create the iPhone project
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          npx cap add ios
          # Hearth's Swift sources, the notification and share extensions, HearthKit, Info.plist, entitlements and
          # the ring sound. Fails if Capacitor's template changed.
          bundle exec ruby scripts/patch-ios.rb ios
      - name: App icon
        continue-on-error: true
        run: npx --no -- capacitor-assets generate --ios --assetPath resources --iconBackgroundColor '#100e16' --iconBackgroundColorDark '#100e16' --splashBackgroundColor '#100e16' --splashBackgroundColorDark '#100e16'
      - run: npx cap sync ios
      # The server's page runs inside the app, so any Capacitor plugin compiled in is reachable from it: only the
      # keyboard one (and Capacitor's own, with its HTTP and cookie plugins turned off in capacitor.config.json).
      - name: Check the project and its plugins
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          bundle exec ruby scripts/patch-ios.rb --check ios
          node -e "
            const c = require('./ios/App/App/capacitor.config.json');
            const bad = (c.packageClassList || []).filter((p) => p !== 'KeyboardPlugin');
            if (bad.length) { console.log('::error::Plugins the remote page could reach: ' + bad.join(', ')); process.exit(1); }
            const spm = require('fs').readFileSync('ios/App/CapApp-SPM/Package.swift', 'utf8');
            const pkgs = [...spm.matchAll(/\.package\((?:url|name): \"([^\"]+)\"/g)].map((m) => m[1]);
            const extra = pkgs.filter((p) => !/capacitor-swift-pm\.git$/.test(p) && p !== 'CapacitorKeyboard');
            if (extra.length) { console.log('::error::Unexpected Swift packages in CapApp-SPM: ' + extra.join(', ')); process.exit(1); }
          "
      # The checked project, before anything builds in it, for ios-archive: that job runs no npm code at all (it
      # holds the App Store Connect key), so the project is made here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.server.outputs.store == '1'
        with:
          name: hearth-ios-project
          path: hearth/mobile/ios
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Pick a simulator
        id: sim
        run: |
          udid="$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices;
            const ios = Object.keys(d).filter((k) => /SimRuntime\.iOS-26/.test(k)).sort().reverse();
            for (const k of ios) { const p = d[k].find((x) => /^iPhone/.test(x.name)); if (p) { console.log(p.udid); break; } }
          ")"
          if [ -z "$udid" ]; then echo "::error::No iOS 26 iPhone simulator on this runner."; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build for the simulator (unsigned)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build
      # Opens the app once and checks it's still running after 20 seconds (the connect screen, then the server's
      # page when HEARTH_SERVER is set). The screenshot shows what it looked like.
      - name: Open it in the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$UDID" app.hearth.mobile
          sleep 20
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/screens/launch.png"
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q 'UIKitApplication:app\.hearth\.mobile'; then
            echo "::error::Hearth quit (or crashed) within 20 seconds of opening in the simulator."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hearth-ios-simulator-screenshot
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: ignore
          retention-days: 7

  # The signed iPhone app (.ipa) for App Store Connect. Tags and the default branch only, in the production
  # environment, and only with the App Store Connect API key (ASC_* secrets) and the APPLE_TEAM_ID variable. A job of
  # its own so that key never reaches the build that runs on every branch, and one that runs no npm package's code:
  # it signs the project the ios job made (for HEARTH_SERVER, locked), after checking nothing in it runs at build
  # time, with Capacitor's keyboard plugin fetched from the exact package-lock.json tarball and Ruby's patch script.
  #   Option A (default): Xcode's cloud-managed signing. The key needs the Admin role; Xcode makes the distribution
  #     certificate and the profiles itself, and no certificate file is ever kept anywhere.
  #   Option B: your own Apple Distribution certificate (IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD) and the
  #     three App Store profiles (IOS_PROFILE_APP_BASE64 / IOS_PROFILE_NSE_BASE64 / IOS_PROFILE_SHARE_BASE64), in a
  #     throwaway keychain. The key then only needs App Manager. See hearth/docs/SIGNING.md.
  ios-archive:
    needs: ios
    if: >-
      github.event.inputs.signpath_test != 'true' &&
      (startsWith(github.ref, 'refs/tags/app-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-26
    environment: production
    defaults:
      run:
        working-directory: hearth/mobile
    outputs:
      built: ${{ steps.ipa.outcome == 'success' && '1' || '' }}
    env:
      BUNDLE_DEPLOYMENT: 'true'
      BUNDLE_WITHOUT: upload
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Only ever HEARTH_SERVER, never a manual run's "server": the App Store build is locked to the publisher's own.
      SERVER: ${{ vars.HEARTH_SERVER }}
      PROJECT: ${{ needs.ios.outputs.project }}
    steps:
      # Which signing, and whether there's any: nothing below runs without it.
      - name: Choose how to sign
        id: signing
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_NSE_BASE64: ${{ secrets.IOS_PROFILE_NSE_BASE64 }}
          IOS_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
          IOS_REQUIRE_SIGNING: ${{ vars.IOS_REQUIRE_SIGNING }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            msg="No signed iPhone app: add the ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 secrets to the production environment and the APPLE_TEAM_ID variable (hearth/docs/SIGNING.md, iPhone)."
            if [ "$IOS_REQUIRE_SIGNING" = "true" ]; then echo "::error title=iPhone signing::$msg"; exit 1; fi
            echo "::warning title=iPhone signing::$msg"
            exit 0
          fi
          if [[ ! "$SERVER" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || [ "$PROJECT" != "1" ]; then
            msg="No signed iPhone app: the App Store build is locked to one server, and the HEARTH_SERVER variable isn't its https://host address."
            if [ "$IOS_REQUIRE_SIGNING" = "true" ]; then echo "::error title=iPhone signing::$msg"; exit 1; fi
            echo "::warning title=iPhone signing::$msg"
            exit 0
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then echo "::error title=iPhone signing::APPLE_TEAM_ID isn't a 10-character team ID."; exit 1; fi
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ]; then
            if [ -z "$IOS_PROFILE_APP_BASE64" ] || [ -z "$IOS_PROFILE_NSE_BASE64" ] || [ -z "$IOS_PROFILE_SHARE_BASE64" ]; then
              echo "::error title=iPhone signing::IOS_DIST_CERT_P12_BASE64 is set, but not all three IOS_PROFILE_*_BASE64 profiles."; exit 1
            fi
            echo "method=manual" >> "$GITHUB_OUTPUT"
          else
            echo "method=cloud" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signing.outputs.method != ''
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: steps.signing.outputs.method != ''
        with:
          ruby-version: '3.3'
          working-directory: hearth/mobile
      - name: Xcode 26
        if: steps.signing.outputs.method != ''
        run: |
          x="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc' | sort -V | tail -1)"
          if [ -z "$x" ]; then echo "::error::No Xcode 26 on this runner."; exit 1; fi
          sudo xcode-select -s "$x"
          xcodebuild -version
      # Option B: the certificate goes into a keychain made for this run (random password), the profiles where Xcode
      # looks for them. Their names go to the patch script, which signs each target with its own.
      - name: Certificate and profiles (option B)
        if: steps.signing.outputs.method == 'manual'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_NSE_BASE64: ${{ secrets.IOS_PROFILE_NSE_BASE64 }}
          IOS_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          kc="$RUNNER_TEMP/hearth-signing.keychain-db"
          kc_pass="$(openssl rand -hex 32)"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          dirs=("$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles")
          mkdir -p "${dirs[@]}"
          for t in APP:app.hearth.mobile NSE:app.hearth.mobile.NotificationService SHARE:app.hearth.mobile.ShareExtension; do
            var="IOS_PROFILE_${t%%:*}_BASE64"; bundle="${t#*:}"
            f="$RUNNER_TEMP/profile-${t%%:*}.mobileprovision"
            printf '%s' "${!var}" | base64 -D > "$f"
            security cms -D -i "$f" > "$f.plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$f.plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$f.plist")"
            appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$f.plist")"
            if [ "$appid" != "$APPLE_TEAM_ID.$bundle" ]; then echo "::error title=iPhone signing::$var is a profile for $appid, not $APPLE_TEAM_ID.$bundle."; exit 1; fi
            for d in "${dirs[@]}"; do cp "$f" "$d/$uuid.mobileprovision"; done
            echo "IOS_PROFILE_${t%%:*}=$name" >> "$GITHUB_ENV"
            echo "$bundle=$name" >> "$RUNNER_TEMP/profiles.txt"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.signing.outputs.method != ''
        with:
          name: hearth-ios-project
          path: hearth/mobile/ios
      # The one Swift package from npm (CapApp-SPM points at node_modules/@capacitor/keyboard): the tarball
      # package-lock.json names, checked against its hash, unpacked without running anything.
      - name: Keyboard plugin from package-lock.json
        if: steps.signing.outputs.method != ''
        run: |
          set -euo pipefail
          read -r url integrity < <(ruby -rjson -e 'p = JSON.parse(File.read("package-lock.json")).dig("packages", "node_modules/@capacitor/keyboard"); puts "#{p["resolved"]} #{p["integrity"]}"')
          [[ "$url" =~ ^https://registry\.npmjs\.org/@capacitor/keyboard/-/keyboard-[0-9.]+\.tgz$ ]] || { echo "::error::Unexpected @capacitor/keyboard source: $url"; exit 1; }
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/keyboard.tgz" "$url"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/keyboard.tgz" | base64 | tr -d '\n')"
          [ "$got" = "$integrity" ] || { echo "::error::@capacitor/keyboard doesn't match package-lock.json"; exit 1; }
          mkdir -p node_modules/@capacitor/keyboard
          tar -xzf "$RUNNER_TEMP/keyboard.tgz" -C node_modules/@capacitor/keyboard --strip-components 1
      - if: steps.signing.outputs.method != ''
        run: bundle install
      # Signed for this team (and with option B's profiles), versioned, then checked again: the same patch script
      # as the ios job, which also refuses build scripts, build rules, swapped compilers and any Swift package but
      # Capacitor's and the keyboard plugin. The App Store build must be locked to HEARTH_SERVER.
      - name: Check the project, sign and version it
        if: steps.signing.outputs.method != ''
        env:
          VERSION_NAME: ${{ needs.ios.outputs.version }}
          VERSION_CODE: ${{ needs.ios.outputs.code }}
        run: |
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          bundle exec ruby scripts/patch-ios.rb ios
          ruby -rjson -e '
            c = JSON.parse(File.read("ios/App/App/public/config.json"))
            unless c["lockServer"] == true && c["defaultServer"] == ENV["SERVER"]
              puts "::error::config.json must lock the app to #{ENV["SERVER"]}: #{c.inspect}"; exit 1
            end
            bad = (JSON.parse(File.read("ios/App/App/capacitor.config.json"))["packageClassList"] || []) - ["KeyboardPlugin"]
            unless bad.empty?
              puts "::error::Plugins the remote page could reach: #{bad.join(", ")}"; exit 1
            end
          '
      # The App Store Connect key, only for the two xcodebuild steps (and only option A signs with it), mode 600.
      - name: App Store Connect key
        if: steps.signing.outputs.method != ''
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" || { echo "::error title=iPhone signing::ASC_KEY_P8_BASE64 isn't a base64 .p8 key (base64 -w0 AuthKey_XXXX.p8)."; exit 1; }
      - name: Archive
        if: steps.signing.outputs.method != ''
        env:
          METHOD: ${{ steps.signing.outputs.method }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          auth=()
          if [ "$METHOD" = cloud ]; then
            auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          fi
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hearth.xcarchive" \
            "${auth[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
      - name: Export the .ipa
        id: ipa
        if: steps.signing.outputs.method != ''
        env:
          METHOD: ${{ steps.signing.outputs.method }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION_NAME: ${{ needs.ios.outputs.version }}
          VERSION_CODE: ${{ needs.ios.outputs.code }}
        run: |
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cp ios-native/ExportOptions.plist "$opts"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$opts"
          auth=()
          if [ "$METHOD" = cloud ]; then
            auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          else
            plutil -replace signingStyle -string manual "$opts"
            plutil -replace signingCertificate -string "Apple Distribution" "$opts"
            plutil -replace provisioningProfiles -json "$(ruby -rjson -e 'puts JSON.generate(File.readlines(ARGV[0], chomp: true).reject(&:empty?).to_h { |l| l.split("=", 2) })' "$RUNNER_TEMP/profiles.txt")" "$opts"
          fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Hearth.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$opts" "${auth[@]}"
          mkdir -p ios-dist
          mv "$RUNNER_TEMP"/export/*.ipa "ios-dist/Hearth-$VERSION_NAME-$VERSION_CODE.ipa"
      - name: Remove the key, certificate and profiles
        if: always()
        working-directory: .
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP"/profile-*.mobileprovision* "$RUNNER_TEMP/profiles.txt"
          if [ -f "$RUNNER_TEMP/hearth-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/hearth-signing.keychain-db" || true; fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision
      # For TestFlight only (the next job): never attached to a release or copied to your server.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ipa.outcome == 'success'
        with:
          name: hearth-ios-ipa
          path: hearth/mobile/ios-dist/*.ipa
          if-no-files-found: error
          retention-days: 7

  # TestFlight: you and the testers you add install Hearth from Apple's TestFlight app; App Review for the store
  # starts from a build here. A job of its own, in the production environment, that runs only fastlane's upload
  # (pinned in Gemfile.lock) on the .ipa.
  testflight-upload:
    needs: ios-archive
    if: >-
      github.event.inputs.signpath_test != 'true' && needs.ios-archive.outputs.built == '1' &&
      (startsWith(github.ref, 'refs/tags/app-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-26
    environment: production
    defaults:
      run:
        working-directory: hearth/mobile
    env:
      BUNDLE_DEPLOYMENT: 'true'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          working-directory: hearth/mobile
      - run: bundle install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hearth-ios-ipa
          path: hearth/mobile/ios-dist
      # The default branch's version is the server's (hearth/package.json): once App Store Connect has approved a
      # tag's version as high or higher, it refuses these until the next app-v* tag. Only a warning there; a tag's
      # upload must work.
      - name: Upload to TestFlight
        id: upload
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          ruby -rjson -rbase64 -e 'print JSON.generate(key_id: ENV.fetch("ASC_KEY_ID"), issuer_id: ENV.fetch("ASC_ISSUER_ID"), key: Base64.decode64(ENV.fetch("ASC_KEY_P8_BASE64")), in_house: false)' > "$RUNNER_TEMP/asc.json"
          ipa="$(ls ios-dist/*.ipa | head -1)"
          bundle exec fastlane run upload_to_testflight ipa:"$ipa" api_key_path:"$RUNNER_TEMP/asc.json" skip_waiting_for_build_processing:true
      - name: Upload refused
        if: steps.upload.outcome == 'failure'
        run: echo "::warning title=TestFlight::App Store Connect didn't take this default-branch build (often its version isn't higher than one already approved). Tag app-vX.Y.Z with a higher version for the next TestFlight build."
      - name: Remove the key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/asc.json"

  release:
    needs: [desktop, android, sign-updates]
    if: github.event.inputs.signpath_test != 'true' && startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # the only job that writes: it creates the GitHub release
    steps:
      # Only the final files: the desktop builds with their update signatures, and the signed APK. Never SignPath's
      # unsigned inputs (hearth-windows-unsigned-*), an unsigned APK, the Play bundle (not installable by itself), or
      # the iPhone .ipa (only Apple distributes it, through TestFlight and the App Store).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hearth-desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.android.outputs.signed == '1'
        with:
          name: hearth-android
          path: dist
      - name: Refuse unsigned and intermediate files
        run: |
          shopt -s nullglob nocaseglob
          bad=(dist/*unsigned* dist/*.aab)
          if [ ${#bad[@]} -gt 0 ]; then echo "::error::Not releasing unsigned or intermediate files: ${bad[*]}"; exit 1; fi
          # The iPhone app only goes to TestFlight and the App Store.
          ipa=(dist/*.ipa)
          if [ ${#ipa[@]} -gt 0 ]; then echo "::error::Not releasing an iPhone app (.ipa): ${ipa[*]}"; exit 1; fi
          apks=(dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "::warning title=Android::No signed APK in this release: add the ANDROID_KEYSTORE_* secrets (hearth/mobile/README.md)."; fi
      # A copy of each installer without the version in its name, so the website can link straight to the newest
      # one (https://github.com/<repo>/releases/latest/download/Hearth-Setup.exe starts the download). The versioned
      # files stay as they are: latest*.yml names those, and the apps update themselves from them. The website
      # links to every copy below, so a release missing one stops here instead of breaking a download button.
      # A version with a pre-release part (app-v1.30.0-beta.1) is released as a pre-release, which GitHub never
      # makes "latest", so the website keeps offering the last stable version.
      - name: Add fixed-name copies for direct download links
        id: copies
        run: |
          shopt -s nullglob
          v="${GITHUB_REF_NAME#app-v}" # the APK's name has the whole version
          dv="${v%%+*}"                # npm version drops +build metadata from the desktop apps' names
          if [[ "$dv" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          cd dist
          for f in "Hearth-Setup-$dv.exe" Hearth-"$dv"-*.dmg Hearth-"$dv"-*.AppImage Hearth-"$dv"-*.deb; do
            if [ -f "$f" ]; then cp -- "$f" "${f/-"$dv"/}"; echo "${f/-"$dv"/} = $f"; fi
          done
          if [ -f "Hearth-$v.apk" ]; then cp -- "Hearth-$v.apk" Hearth.apk; echo "Hearth.apk = Hearth-$v.apk"; fi
          missing=0
          for n in Hearth-Setup.exe Hearth-arm64.dmg Hearth-amd64.deb Hearth-x86_64.AppImage Hearth.apk; do
            if [ ! -f "$n" ]; then echo "::error title=Website download::No $n in this release, so the website's link to it would be broken."; missing=1; fi
          done
          exit "$missing"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: false
          prerelease: ${{ steps.copies.outputs.prerelease }}

  # Only release builds reach everyone's apps (the desktop app updates itself from this folder): tags and the
  # default branch, whether pushed or run by hand. Never another branch, not even by a manual run.
  publish-to-vps:
    needs: [desktop, android, sign-updates]
    if: >-
      always() && github.event.inputs.signpath_test != 'true' && (needs.sign-updates.result == 'success' || needs.android.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/app-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      # Only the final files, as for the release: the desktop builds once their update files are signed, and the
      # signed APK. Nothing unsigned or intermediate ever reaches the download folder people's apps update from.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_VPS == 'true' && needs.sign-updates.result == 'success'
        with:
          pattern: hearth-desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_VPS == 'true' && needs.android.result == 'success' && needs.android.outputs.signed == '1'
        with:
          name: hearth-android
          path: dist
      - name: Refuse unsigned and intermediate files
        if: env.HAS_VPS == 'true'
        run: |
          shopt -s nullglob nocaseglob
          bad=(dist/*unsigned* dist/*.aab)
          if [ ${#bad[@]} -gt 0 ]; then echo "::error::Not publishing unsigned or intermediate files: ${bad[*]}"; exit 1; fi
          # The iPhone app only goes to TestFlight and the App Store.
          ipa=(dist/*.ipa)
          if [ ${#ipa[@]} -gt 0 ]; then echo "::error::Not publishing an iPhone app (.ipa): ${ipa[*]}"; exit 1; fi
      # The runner's own OpenSSH does the copy: no third-party action (or the image or download one could swap in
      # without a new commit) ever sees VPS_SSH_KEY. ssh only talks to the machine whose host key matches
      # VPS_HOST_FINGERPRINT, which is required: without it nothing is copied.
      - name: Copy installers to the server
        if: env.HAS_VPS == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
          VPS_DOWNLOADS_DIR: ${{ secrets.VPS_DOWNLOADS_DIR }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/vps-ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          want="$(printf '%s' "$VPS_HOST_FINGERPRINT" | tr -d ' \r\n')"
          want="${want#SHA256:}"
          want="${want%%=*}"
          if [ -z "$want" ]; then
            echo "::error::Add the secret VPS_HOST_FINGERPRINT: the server's SSH host key fingerprint (on the server: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub, the SHA256:... part). Nothing was copied."
            exit 1
          fi
          # Ask the server for its host keys and keep only the one with the pinned fingerprint. ssh then refuses
          # any machine that can't prove it holds that key.
          : > "$ssh_dir/known_hosts"
          ssh-keyscan -T 20 -- "$VPS_HOST" 2>/dev/null > "$ssh_dir/offered" || true
          while IFS= read -r line; do
            case "$line" in '' | '#'*) continue ;; esac
            printf '%s\n' "$line" > "$ssh_dir/one"
            fp="$(ssh-keygen -lf "$ssh_dir/one" 2>/dev/null | awk '{ print $2 }')" || fp=""
            fp="${fp#SHA256:}"
            if [ -n "$fp" ] && [ "${fp%%=*}" = "$want" ]; then printf '%s\n' "$line" >> "$ssh_dir/known_hosts"; fi
          done < "$ssh_dir/offered"
          if [ ! -s "$ssh_dir/known_hosts" ]; then
            echo "::error::$VPS_HOST didn't show the host key that VPS_HOST_FINGERPRINT names (or couldn't be reached). Nothing was copied."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/*.apk dist/*.blockmap dist/latest*.yml dist/latest*.yml.sig)
          if [ ${#files[@]} -eq 0 ]; then echo "No installers to copy."; exit 0; fi
          host="$VPS_HOST"
          case "$host" in *:*) host="[$host]" ;; esac
          scp -i "$ssh_dir/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 -- "${files[@]}" "$VPS_USER@$host:$VPS_DOWNLOADS_DIR/"
      - name: Keep only the two newest of each installer on the server
        if: env.HAS_VPS == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DOWNLOADS_DIR: ${{ secrets.VPS_DOWNLOADS_DIR }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/vps-ssh"
          # The folder reaches the server's shell as one single-quoted word, whatever characters it has.
          q="'$(printf '%s' "$VPS_DOWNLOADS_DIR" | sed "s/'/'\\\\''/g")'"
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "sh -s -- $q" <<'EOF'
          cd "$1" || exit 0
          for pat in 'Hearth-Setup-*.exe' 'Hearth-*.AppImage' 'Hearth-*.deb' 'Hearth-*.dmg' 'Hearth-*.apk' '*.exe.blockmap'; do
            ls -t $pat 2>/dev/null | tail -n +3 | while read -r f; do rm -f -- "$f"; done
          done
          EOF
